name: Release bauen

# Baut ein Release, sobald ein Tag vX.Y.Z kommt oder app/VERSION / der Changelog auf main geändert wird.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["app/VERSION", "CHANGELOG-aktuell.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat app/VERSION)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu app/VERSION ($V)"; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$V gibt es schon – nichts zu tun."; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.v.outputs.skip != '1'
        with:
          go-version: "1.24"
          cache: false

      - name: go-winres installieren
        if: steps.v.outputs.skip != '1'
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Setup bauen
        if: steps.v.outputs.skip != '1'
        run: WINRES="$(go env GOPATH)/bin/go-winres" ./build.sh

      - name: Release veröffentlichen
        if: steps.v.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MusicBox ${{ env.VERSION }}
          body_path: CHANGELOG-aktuell.md
          files: Ascandir-MusicBox-Setup.exe
          make_latest: true
